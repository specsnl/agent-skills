# https://taskfile.dev
version: "3"

silent: true

vars:
  MARKETPLACE_NAME: specs
  MARKETPLACE_REPO: specsnl/agent-skills
  # Latest version of MarkdownLint:
  #   - https://hub.docker.com/r/davidanson/markdownlint-cli2/tags
  #   - https://github.com/DavidAnson/markdownlint-cli2/tags
  MARKDOWNLINT_VERSION: v0.23.3
  # Latest version of Node: https://hub.docker.com/_/node/tags
  NODE_VERSION: 24.21.0-bookworm

tasks:
  marketplace:add:
    desc: Add this marketplace to Claude
    cmds:
      - task: marketplace:add:claude

  marketplace:add:repo:
    desc: Add this marketplace using the remote repository
    cmds:
      - echo ">> Adding marketplace to Claude..."
      - claude plugin marketplace add {{.MARKETPLACE_REPO}}

  marketplace:add:claude:
    desc: Add this marketplace to Claude
    internal: true
    preconditions:
      - sh: command -v claude
        msg: "Claude is not installed. Please install Claude to add this marketplace."
    cmds:
      - echo ">> Adding marketplace to Claude..."
      - claude plugin marketplace add ./

  marketplace:remove:
    desc: Remove this marketplace from Claude
    cmds:
      - task: marketplace:remove:claude

  marketplace:remove:claude:
    desc: Remove this marketplace from Claude
    internal: true
    preconditions:
      - sh: command -v claude
        msg: "Claude is not installed. Please install Claude to add this marketplace."
    cmds:
      - echo ">> Removing marketplace from Claude..."
      - cmd: claude plugin marketplace remove {{.MARKETPLACE_NAME}}
        ignore_error: true

  marketplace:reset:
    desc: Reset this marketplace in Claude
    cmds:
      - task: marketplace:remove
      - task: marketplace:add

  plugin:list:
    desc: List available plugins
    cmds:
      - claude plugin marketplace browse specs

  marketplace:update:
    desc: Update this marketplace in Claude
    cmds:
      - claude plugin marketplace update {{.MARKETPLACE_NAME}}

  plugin:install:*:
    desc: Install a plugin in Claude
    vars:
      PLUGIN: '{{index .MATCH 0}}'
    cmds:
      - claude plugin install {{.PLUGIN}}@{{.MARKETPLACE_NAME}}

  md:checkstyle:
    desc: Check style of Markdown files
    cmds:
      - docker run
        --rm
        --volume $(pwd):/workdir
        davidanson/markdownlint-cli2:{{.MARKDOWNLINT_VERSION}}
        {{.SUB_CMD}}
        {{.CLI_ARGS}}

  md:fixstyle:
    desc: Fix style of Markdown files — align tables, then apply autofixable lint rules
    cmds:
      - task: md:fix-tables
      - task: md:checkstyle
        vars: { SUB_CMD: --fix }

  md:fix-tables:
    desc: Align table spacing in Markdown files
    cmds:
      # dotglob so hidden directories (e.g. .github) are covered too.
      - docker run
        --rm
        --volume $(pwd):/app
        --workdir /app
        node:{{.NODE_VERSION}}
        bash -c "shopt -s globstar dotglob && npx --yes markdown-table-formatter **/*.md"

  hooks:install:
    desc: Install git hooks
    cmds:
      - cp .githooks/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - echo ">> Git hooks installed"

  hooks:uninstall:
    desc: Uninstall git hooks
    cmds:
      - rm -f .git/hooks/pre-commit
      - echo ">> Git hooks uninstalled"
