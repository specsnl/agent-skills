# https://taskfile.dev
version: "3"

vars:
  # Resolves to the shared hooks directory, also from inside a worktree (where .git is a file).
  HOOKS_DIR:
    sh: git rev-parse --git-path hooks

tasks:
  install:
    desc: Install git hooks
    cmds:
      - cp .githooks/pre-commit "{{.HOOKS_DIR}}/pre-commit"
      - chmod +x "{{.HOOKS_DIR}}/pre-commit"
      - echo ">> Git hooks installed"

  uninstall:
    desc: Uninstall git hooks
    cmds:
      - rm -f "{{.HOOKS_DIR}}/pre-commit"
      - echo ">> Git hooks uninstalled"
