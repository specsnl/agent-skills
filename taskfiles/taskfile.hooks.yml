# https://taskfile.dev
version: "3"

vars:
  # Resolves to the shared hooks directory, also from inside a worktree (where .git is a file). Not --git-path
  # hooks: that follows a global core.hooksPath, and the copy would overwrite the global hooks.
  HOOKS_DIR:
    sh: echo "$(git rev-parse --path-format=absolute --git-common-dir)/hooks"

tasks:
  install:
    desc: Install git hooks
    cmds:
      - cp .githooks/pre-commit "{{.HOOKS_DIR}}/pre-commit"
      - chmod +x "{{.HOOKS_DIR}}/pre-commit"
      - echo ">> Git hooks installed"

  uninstall:
    desc: Uninstall git hooks
    cmds:
      - rm -f "{{.HOOKS_DIR}}/pre-commit"
      - echo ">> Git hooks uninstalled"
