# https://taskfile.dev
version: "3"

tasks:
  list:
    desc: List available plugins
    cmds:
      - claude plugin marketplace browse {{ .MARKETPLACE_NAME }}

  install:*:
    desc: Install a plugin in Claude
    vars:
      PLUGIN: '{{ index .MATCH 0 }}'
    cmds:
      - claude plugin install {{ .PLUGIN }}@{{ .MARKETPLACE_NAME }}
