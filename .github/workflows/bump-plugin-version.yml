name: Bump plugin version

on:
  push:
    branches:
      - main

env:
  BOT_USER_ID: 277490085

jobs:
  bump-version:
    runs-on: ubuntu-26.04
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.SPECS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPECS_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Detect plugin changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            plugins:
              - 'plugins/**'

      - name: Bump plugin versions
        if: steps.filter.outputs.plugins == 'true'
        run: |
          bash .githooks/bump-versions.sh

          MARKETPLACE_FILE=".claude-plugin/marketplace.json"
          git config user.name "specsnl[bot]"
          git config user.email "${BOT_USER_ID}+specsnl[bot]@users.noreply.github.com"
          git add "$MARKETPLACE_FILE"
          git diff --cached --quiet || (
            git commit -m "chore: bump plugin version(s)"
            git push
          )
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
